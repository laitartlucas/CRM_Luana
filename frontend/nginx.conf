server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy same-origin para o backend (rede privada do Railway). Precisa ser
    # same-origin (não um domínio *.up.railway.app separado) para que o
    # cookie de sessão seja first-party — Safari (ITP) e navegadores com
    # bloqueio de cookie de terceiros descartam o cookie em requests cross-site.
    #
    # resolver + variável em proxy_pass: nginx só resolve hostnames literais
    # no proxy_pass uma vez, na subida do worker. Como o IP interno do backend
    # muda a cada deploy/restart, isso deixava o proxy apontando pra um IP
    # morto até o próximo reload. Usar variável força reresolução via DNS do
    # Railway (fd12::10) a cada 10s.
    resolver fd12::10 valid=10s ipv6=on;

    location /api/ {
        set $backend_upstream backend.railway.internal:3000;
        proxy_pass http://$backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não seja um arquivo real cai no index.html
    # (React Router cuida do resto no client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
